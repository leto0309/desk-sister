[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "desk-sister"
version = "0.1.2"
requires-python = ">=3.11"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Warnings in tests (deprecations, unclosed resources) fail verification instead of scrolling past.
filterwarnings = ["error"]
[tool.ruff]
target-version = "py311"
[tool.ruff.lint]
# Explicit rules, so a ruff upgrade cannot silently change what verify enforces:
# syntax and statement errors plus pyflakes (unused imports and variables, undefined names).
select = ["E4", "E7", "E9", "F"]
