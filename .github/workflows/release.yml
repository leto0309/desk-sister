name: Approved release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved SemVer (example 0.1.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Validate version and install project dependencies
        env:
          VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$') { throw 'Invalid version' }
          if (Test-Path requirements-dev.txt) { python -m pip install -r requirements-dev.txt; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          if (Test-Path package.json) { if (Test-Path package-lock.json) { npm ci } else { npm install --ignore-scripts }; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - run: ./scripts/package.ps1
        shell: pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified build and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GH_REPO" --name release-files --dir release-files
          gh release create "v$VERSION" release-files/* --repo "$GH_REPO" --target "$TARGET" --title "v$VERSION" --generate-notes
