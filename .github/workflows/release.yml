name: Approved release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved SemVer (example 0.1.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Validate version and install project dependencies
        env:
          VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$') { throw 'Invalid version' }
          if (Test-Path requirements-dev.txt) { python -m pip install -r requirements-dev.txt; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          if (Test-Path package.json) { if (Test-Path package-lock.json) { npm ci } else { npm install --ignore-scripts }; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - run: ./scripts/package.ps1
        shell: pwsh
      - name: Install Inno Setup (pinned, hash-checked)
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $sha = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $sha) { throw 'Inno Setup download does not match its SHA-256' }
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $p = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed ($($p.ExitCode))" }
          "ISCC=$dir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: ./devtools/build_installer.ps1 -Version $env:VERSION -Iscc $env:ISCC -Python python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified build and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GH_REPO" --name release-files --dir release-files
          gh release create "v$VERSION" release-files/* --repo "$GH_REPO" --target "$TARGET" --title "v$VERSION" --generate-notes
