name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: windows-latest  # the app is Windows-only (Win32 capture, Credential Manager, shortcuts)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: ./scripts/verify.ps1
        shell: pwsh
      - run: ./scripts/build.ps1
        shell: pwsh
